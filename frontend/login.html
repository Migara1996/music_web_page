<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-center">
    <div class="card auth-card">
      <h1>Music Subscription App</h1>
      <h2>Login</h2>

      <form id="loginForm" autocomplete="off">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" autocomplete="off" required />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="new-password" required />

        <button type="submit">Login</button>
      </form>

      <p id="loginMessage" class="message error"></p>

      <p class="small-text">
        Don't have an account?
        <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
